    function ScoreGauge({ score }) {
      const color = score >= 70 ? "#22c55e" : score >= 45 ? "#f59e0b" : "#ef4444";
      const label = score >= 70 ? "Good" : score >= 45 ? "Needs Work" : "Critical";
      const r = 36, circ = 2 * Math.PI * r;
      const offset = circ - (score / 100) * circ;
      return (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"4px" }}>
          <svg width="96" height="96" viewBox="0 0 96 96">
            <circle cx="48" cy="48" r={r} fill="none" stroke="#1e293b" strokeWidth="8" />
            <circle cx="48" cy="48" r={r} fill="none" stroke={color} strokeWidth="8"
              strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
              transform="rotate(-90 48 48)" style={{ transition:"stroke-dashoffset 1s ease" }} />
            <text x="48" y="54" textAnchor="middle" fill={color} fontSize="20" fontWeight="700" fontFamily="DM Mono, monospace">{score}</text>
          </svg>
          <span style={{ color, fontSize:"11px", fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase" }}>{label}</span>
        </div>
      );
    }

                  <div>
                    <h2 style={{ fontSize:24, fontWeight:700, color:"#f8fafc", margin:0 }}>{selectedNiche && selectedNiche.label}</h2>
                    <p style={{ color:"#64748b", fontSize:13, margin:"4px 0 0" }}>Select a location to find businesses</p>
                  </div>
                </div>

                <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
                  {/* Country */}
                  <div>
                    <label style={{ display:"block", fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#64748b", marginBottom:8 }}>Country</label>
                    <select value={country} onChange={e => { setCountry(e.target.value); setState(""); setCity(""); }}
                      style={{ width:"100%", background:"#0f172a", border:"1px solid #334155", borderRadius:12, padding:"12px 40px 12px 16px", color:"#f1f5f9", fontSize:14, outline:"none", appearance:"none", cursor:"pointer" }}>
                      <option value="">Select a country...</option>
                      {COUNTRIES.map(c => <option key={c}>{c}</option>)}
                    </select>
                  </div>

                  {country && (
                    <div>
                      <label style={{ display:"block", fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#64748b", marginBottom:8 }}>State / Province</label>
                      <select value={state} onChange={e => { setState(e.target.value); setCity(""); }}
                        style={{ width:"100%", background:"#0f172a", border:"1px solid #334155", borderRadius:12, padding:"12px 40px 12px 16px", color:"#f1f5f9", fontSize:14, outline:"none", appearance:"none", cursor:"pointer" }}>
                        <option value="">Select a state...</option>
                        {(STATES[country] || []).map(s => <option key={s}>{s}</option>)}
                      </select>
                    </div>
                  )}

                  {state && (
                    <div>
                      <label style={{ display:"block", fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#64748b", marginBottom:8 }}>City</label>
                      <select value={city} onChange={e => setCity(e.target.value)}
                        style={{ width:"100%", background:"#0f172a", border:"1px solid #334155", borderRadius:12, padding:"12px 40px 12px 16px", color:"#f1f5f9", fontSize:14, outline:"none", appearance:"none", cursor:"pointer" }}>
                        <option value="">Select a city...</option>
                        {(CITIES[state] || []).map(c => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                  )}

                  {city && (
                    <button onClick={goToList} className="btn-primary"
                      style={{ width:"100%", padding:"14px", borderRadius:12, border:"none", fontWeight:600, fontSize:14, cursor:"pointer", boxShadow:"0 8px 24px rgba(6,182,212,0.2)", marginTop:4 }}>
                      Search {businesses.length} Businesses in {city} →
                    </button>
                  )}
                </div>

                <div style={{ marginTop:32, padding:16, borderRadius:12, border:"1px solid #1e293b", background:"rgba(15,23,42,0.4)" }}>
                  <p style={{ margin:0, fontSize:12, color:"#475569", lineHeight:1.7 }}>
                    <span style={{ color:"#64748b", fontWeight:600 }}>How it works: </span>
                    We scan business websites in your selected city for common technical issues — SSL problems, mobile compatibility, SEO gaps, and more.
                  </p>
                </div>
              </div>
            )}

            {/* ── SCREEN 3: BUSINESS LIST ── */}
            {screen === 3 && (
              <div>
                <button onClick={() => setScreen(2)} style={{ display:"flex", alignItems:"center", gap:8, color:"#64748b", fontSize:13, marginBottom:24, background:"none", border:"none", cursor:"pointer", transition:"color 0.2s" }}
                  onMouseOver={e => e.currentTarget.style.color="#22d3ee"} onMouseOut={e => e.currentTarget.style.color="#64748b"}>
                  ← Change location
                </button>

                <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:16, marginBottom:32 }}>
                  <div>
                    <h2 style={{ fontSize:24, fontWeight:700, color:"#f8fafc", margin:0 }}>{selectedNiche && selectedNiche.label} in {city}</h2>
                    <p style={{ color:"#64748b", fontSize:13, margin:"6px 0 0" }}>{businesses.length} businesses found · Sorted by audit score</p>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 14px", borderRadius:10, background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.2)" }}>
                    <div className="pulse" style={{ width:8, height:8, borderRadius:"50%", background:"#f87171" }} />
                    <span style={{ color:"#f87171", fontSize:12, fontWeight:600 }}>{businesses.filter(b => b.score < 50).length} need urgent help</span>
                  </div>
                </div>

                <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                  {businesses.map(biz => {
                    const badgeClass = biz.score >= 70 ? "score-badge-good" : biz.score >= 45 ? "score-badge-warn" : "score-badge-bad";
                    return (
                      <div key={biz.id} onClick={() => goToReport(biz)} className="biz-card"
                        style={{ padding:"20px", borderRadius:16, border:"1px solid rgba(51,65,85,0.6)", background:"rgba(15,23,42,0.5)", cursor:"pointer", display:"flex", alignItems:"flex-start", gap:20, transition:"all 0.2s" }}>
                        <div style={{ width:56, height:56, borderRadius:12, background:"#1e293b", border:"1px solid #334155", display:"flex", alignItems:"center", justifyContent:"center", fontSize:26, flexShrink:0 }}>
                          {selectedNiche && selectedNiche.icon}
                        </div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:8, marginBottom:6 }}>
                            <h3 className="biz-name" style={{ fontWeight:600, color:"#f1f5f9", margin:0, fontSize:15, transition:"color 0.2s" }}>{biz.name}</h3>
                            <span className={badgeClass} style={{ padding:"2px 10px", borderRadius:6, fontSize:12, fontFamily:"'DM Mono',monospace", fontWeight:600, flexShrink:0 }}>
                              Score: {biz.score}/100
                            </span>
                          </div>
                          <p style={{ color:"#64748b", fontSize:12, margin:"0 0 12px" }}>{biz.address} · {biz.website}</p>
                          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                            {biz.issues.map(issue => <IssueBadge key={issue} issue={issue} />)}
                          </div>
                        </div>
                        <span style={{ color:"#334155", fontSize:18, flexShrink:0 }}>›</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ── SCREEN 4: REPORT ── */}
            {screen === 4 && selectedBiz && (
              <div>
                <button onClick={() => setScreen(3)} style={{ display:"flex", alignItems:"center", gap:8, color:"#64748b", fontSize:13, marginBottom:24, background:"none", border:"none", cursor:"pointer" }}
                  onMouseOver={e => e.currentTarget.style.color="#22d3ee"} onMouseOut={e => e.currentTarget.style.color="#64748b"}>
                  ← Back to list
                </button>

                {/* Header card */}
                <div style={{ borderRadius:16, border:"1px solid #334155", background:"rgba(15,23,42,0.7)", padding:24, marginBottom:20 }}>
                  <div style={{ display:"flex", alignItems:"flex-start", gap:20, flexWrap:"wrap" }}>
                    <div style={{ width:60, height:60, borderRadius:12, background:"#1e293b", border:"1px solid #334155", display:"flex", alignItems:"center", justifyContent:"center", fontSize:28, flexShrink:0 }}>
                      {selectedNiche && selectedNiche.icon}
                    </div>
                    <div style={{ flex:1, minWidth:200 }}>
                      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:12, marginBottom:12 }}>
                        <div>
                          <h1 style={{ fontSize:24, fontWeight:700, color:"#f8fafc", margin:0 }}>{selectedBiz.name}</h1>
                          <p style={{ color:"#64748b", fontSize:13, margin:"4px 0 0" }}>{selectedBiz.address} · {city}, {state}</p>
                        </div>
                        <ScoreGauge score={selectedBiz.score} />
                      </div>
                      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:10 }}>
                        {[
                          { icon:"📞", label:"Phone",   value: selectedBiz.phone   },
                          { icon:"✉️", label:"Email",   value: selectedBiz.email   },
                          { icon:"🌐", label:"Website", value: selectedBiz.website },
                        ].map(({ icon, label, value }) => (
                          <div key={label} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:10, background:"rgba(30,41,59,0.6)", border:"1px solid rgba(51,65,85,0.6)" }}>
                            <span style={{ fontSize:16 }}>{icon}</span>
                            <div style={{ minWidth:0 }}>
                              <div style={{ color:"#64748b", fontSize:11 }}>{label}</div>
                              <div style={{ color:"#e2e8f0", fontSize:13, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{value}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Issue summary */}
                <div style={{ display:"flex", alignItems:"center", flexWrap:"wrap", gap:8, marginBottom:24 }}>
                  <span style={{ fontSize:13, fontWeight:600, color:"#cbd5e1" }}>Issues detected:</span>
                  {selectedBiz.issues.map(issue => <IssueBadge key={issue} issue={issue} />)}
                </div>

                {/* Audit cards */}
                <h2 style={{ fontSize:18, fontWeight:600, color:"#f1f5f9", marginBottom:16 }}>Full Technical Audit</h2>
                <div style={{ display:"flex", flexDirection:"column", gap:16, marginBottom:32 }}>
                  {selectedBiz.issues.map(issue => {
                    const detail   = AUDIT_DETAILS[issue];
                    const priority = (ISSUE_META[issue] || {}).priority || "medium";
                    const styles   = {
                      critical: { dot:"dot-critical", text:"text-critical", label:"Critical",        border:"card-critical" },
                      high:     { dot:"dot-high",     text:"text-high",     label:"High Priority",   border:"card-high"     },
                      medium:   { dot:"dot-medium",   text:"text-medium",   label:"Medium Priority", border:"card-medium"   },
                      low:      { dot:"dot-low",      text:"text-low",      label:"Low Priority",    border:"card-low"      },
                    }[priority];
                    return (
                      <div key={issue} className={styles.border}
                        style={{ borderRadius:16, border:"1px solid", background:"rgba(15,23,42,0.5)", overflow:"hidden" }}>
                        <div style={{ padding:"14px 20px", borderBottom:"1px solid rgba(30,41,59,0.6)", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                            <div className={styles.dot} style={{ width:10, height:10, borderRadius:"50%", flexShrink:0 }} />
                            <span style={{ fontWeight:600, color:"#f1f5f9", fontSize:14 }}>{issue}</span>
                          </div>
                          <span className={styles.text} style={{ fontSize:12, fontWeight:700 }}>{styles.label}</span>
                        </div>
                        {detail && (
                          <div style={{ padding:20, display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:20 }}>
                            <div>
                              <div style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#64748b", marginBottom:8 }}>Impact</div>
                              <p style={{ color:"#cbd5e1", fontSize:13, lineHeight:1.6, fontWeight:500, margin:"0 0 16px" }}>{detail.impact}</p>
                              <div style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"#64748b", marginBottom:8 }}>Analysis</div>
                              <p style={{ color:"#94a3b8", fontSize:13, lineHeight:1.7, margin:0 }}>{detail.description}</p>
                            </div>
                            <div style={{ borderLeft:"1px solid rgba(30,41,59,0.8)", paddingLeft:20 }}>
                              <div style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:"rgba(6,182,212,0.7)", marginBottom:8 }}>Recommended Fix</div>
                              <p style={{ color:"#cbd5e1", fontSize:13, lineHeight:1.7, margin:0 }}>{detail.fix}</p>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* CTA footer */}
                <div style={{ borderRadius:16, border:"1px solid rgba(6,182,212,0.2)", background:"linear-gradient(135deg,rgba(6,182,212,0.05),rgba(37,99,235,0.05))", padding:28, textAlign:"center" }}>
                  <h3 style={{ fontSize:18, fontWeight:700, color:"#f8fafc", margin:"0 0 8px" }}>Ready to help {selectedBiz.name}?</h3>
                  <p style={{ color:"#94a3b8", fontSize:14, margin:"0 0 24px" }}>This report shows {selectedBiz.issues.length} fixable issues. Businesses like this are actively looking for help.</p>
                  <div style={{ display:"flex", gap:12, justifyContent:"center", flexWrap:"wrap" }}>
                    <button className="btn-primary" style={{ padding:"12px 24px", borderRadius:12, border:"none", fontWeight:600, fontSize:14, cursor:"pointer", boxShadow:"0 8px 24px rgba(6,182,212,0.2)" }}>
                      Generate Outreach Email
                    </button>
                    <button onClick={reset} className="btn-secondary" style={{ padding:"12px 24px", borderRadius:12, fontWeight:600, fontSize:14, cursor:"pointer", background:"none" }}>
                      Find More Businesses
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
