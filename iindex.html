<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlobalB2B | Premium Business Directory</title>
    
    <!-- Scripts & Stylesheets -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .premium-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .paywall-blur { backdrop-filter: blur(12px); }
        input, select { -webkit-appearance: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURATION & API KEYS ---
        // Replace with your real keys for production
        const GOOGLE_PLACES_API_KEY = ''; 
        const RAPID_API_KEY = ''; 

        // --- REAL WORLD DATA CONSTANTS ---
        const COUNTRIES = ["United States", "India", "United Kingdom", "Germany", "Singapore", "UAE", "Australia"];
        const SECTORS = [
            "AI Software", "Tech Hardware", "Equity Consulting", "Supply Chain", "Agri Export", 
            "Healthcare Diagnostics", "Renewable Energy", "FinTech Solutions", "Legal Services", "Cloud Infrastructure",
            "Biotechnology", "E-commerce Logistics", "Digital Marketing", "HR Tech", "Cybersecurity",
            "Industrial Robotics", "Commercial Real Estate", "Venture Capital", "Automotive Parts", "Telecommunications",
            "Petrochemicals", "Pharmaceuticals", "Textile Manufacturing", "Waste Management", "Hospitality Group",
            "Maritime Shipping", "Aerospace Defense", "Mining Equipment", "Public Relations", "Data Analytics",
            "Construction Tech", "Food Processing", "Corporate Training", "Apparel Wholesale", "Consumer Electronics",
            "Graphic Design Agency", "Investment Banking", "Medical Devices", "Smart Home Tech", "Electric Vehicles",
            "Organic Farming", "Warehouse Automation", "Interior Design B2B", "Translation Services", "Luxury Goods",
            "Event Management", "Non-Profit Admin", "Printing Services", "Custom Software", "Property Management"
        ];

        // --- MOCK FALLBACK DATA (High Fidelity) ---
        const MOCK_DATA = [
            { id: 1, name: "Nexus AI Systems", sector: "AI Software", city: "San Francisco", country: "USA", phone: "+1 415 555 0123", email: "contact@nexusai.io", address: "Market St, Suite 400" },
            { id: 2, name: "Bharat Exports Ltd", sector: "Agri Export", city: "Mumbai", country: "India", phone: "+91 22 4000 1234", email: "info@bharatexport.in", address: "BKC, G-Block" },
            { id: 3, name: "GreenWatt Energy", sector: "Renewable Energy", city: "Berlin", country: "Germany", phone: "+49 30 123456", email: "sales@greenwatt.de", address: "Friedrichstraße 12" },
            { id: 4, name: "Global Logistics Co", sector: "Supply Chain", city: "Dubai", country: "UAE", phone: "+971 4 888 0000", email: "ops@globallogistics.ae", address: "Jebel Ali Free Zone" },
            { id: 5, name: "Silicon Hardware Corp", sector: "Tech Hardware", city: "Austin", country: "USA", phone: "+1 512 777 8888", email: "orders@siliconhardware.com", address: "Tech Ridge Blvd" }
        ];

        const App = () => {
            const [search, setSearch] = useState("");
            const [country, setCountry] = useState("");
            const [sector, setSector] = useState("");
            const [results, setResults] = useState(MOCK_DATA);
            const [loading, setLoading] = useState(false);
            const [trialsUsed, setTrialsUsed] = useState(() => parseInt(localStorage.getItem('trials') || '0'));
            const [showPaywall, setShowPaywall] = useState(false);
            
            // Equity Calculator State
            const [profit, setProfit] = useState("");
            const [equity, setEquity] = useState("");
            const [earnings, setEarnings] = useState(0);

            // Sync Trials to LocalStorage
            useEffect(() => {
                localStorage.setItem('trials', trialsUsed);
            }, [trialsUsed]);

            // Real Data Fetching Function
            const fetchBusinessData = async (query, selectedSector) => {
                setLoading(true);
                
                // If no API Key is provided, simulate a delay and use Mock Data
                if (!GOOGLE_PLACES_API_KEY) {
                    setTimeout(() => {
                        const filtered = MOCK_DATA.filter(item => 
                            item.name.toLowerCase().includes(query.toLowerCase()) || 
                            item.sector === selectedSector
                        );
                        setResults(filtered.length > 0 ? filtered : MOCK_DATA);
                        setLoading(false);
                    }, 800);
                    return;
                }

                try {
                    // This is a pattern for Google Places Text Search or RapidAPI B2B
                    const response = await fetch(`https://maps.googleapis.com/maps/api/place/textsearch/json?query=${query}+${selectedSector}&key=${GOOGLE_PLACES_API_KEY}`);
                    const data = await response.json();
                    // Process Google Data to our format
                    const formatted = data.results.map(r => ({
                        id: r.place_id,
                        name: r.name,
                        sector: selectedSector,
                        city: r.formatted_address.split(',').reverse()[2],
                        country: r.formatted_address.split(',').reverse()[0],
                        phone: "Locked - View Detail",
                        email: "Locked - View Detail",
                        address: r.formatted_address
                    }));
                    setResults(formatted);
                } catch (error) {
                    console.error("API Error:", error);
                } finally {
                    setLoading(false);
                }
            };

            const handleViewDetails = (id) => {
                if (trialsUsed >= 3) {
                    setShowPaywall(true);
                    return;
                }
                setTrialsUsed(prev => prev + 1);
                alert("Detail View Unlocked! (Contact info now visible in a real implementation)");
            };

            const calculateEquity = () => {
                const total = (parseFloat(profit) * parseFloat(equity)) / 100;
                setEarnings(total || 0);
            };

            // Payment Integration Handler
            const handlePayment = (amount) => {
                alert(`Redirecting to Secure Gateway... 
                \nAmount: $${amount}
                \nNote: For Indian Users, this will be processed via Razorpay International at current FX rates (~${amount * 83} INR).
                \nStatus: Pending Stripe/Razorpay Handshake.`);
                
                /* 
                   STRIPE/RAZORPAY INTEGRATION LOGIC:
                   1. Backend creates a "Payment Intent" (Stripe) or "Order" (Razorpay).
                   2. The response returns a client_secret.
                   3. frontend calls Stripe.confirmCardPayment() or Razorpay.open().
                   4. For International -> INR: Use Razorpay's multi-currency support. 
                      It captures USD and settles in your Indian Bank Account in INR automatically.
                */
            };

            return (
                <div className="min-h-screen pb-20">
                    {/* 1. STICKY HEADER & SEARCH */}
                    <div className="sticky top-0 z-40 glass-effect border-b border-slate-200 px-4 py-3">
                        <div className="flex items-center gap-2 mb-3">
                            <div className="bg-indigo-600 p-1.5 rounded-lg">
                                <i data-lucide="globe" className="text-white w-5 h-5"></i>
                            </div>
                            <h1 className="text-xl font-bold text-slate-800 tracking-tight">GlobalB2B</h1>
                            <div className="ml-auto flex items-center bg-indigo-50 px-3 py-1 rounded-full">
                                <span className="text-xs font-bold text-indigo-600 tracking-wider">TRIALS: {3-trialsUsed}/3</span>
                            </div>
                        </div>
                        
                        <div className="relative">
                            <input 
                                type="text"
                                placeholder="Search global companies..."
                                className="w-full bg-slate-100 border-none rounded-xl py-3 pl-11 pr-4 text-sm focus:ring-2 focus:ring-indigo-500"
                                onChange={(e) => setSearch(e.target.value)}
                            />
                            <i data-lucide="search" className="absolute left-4 top-3.5 text-slate-400 w-4 h-4"></i>
                        </div>

                        {/* CASCADING FILTERS */}
                        <div className="flex gap-2 mt-3 overflow-x-auto hide-scrollbar">
                            <select 
                                className="bg-white border border-slate-200 text-xs font-medium px-3 py-2 rounded-lg whitespace-nowrap"
                                onChange={(e) => setCountry(e.target.value)}
                            >
                                <option value="">Select Country</option>
                                {COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                            <select 
                                className="bg-white border border-slate-200 text-xs font-medium px-3 py-2 rounded-lg whitespace-nowrap"
                                onChange={(e) => setSector(e.target.value)}
                            >
                                <option value="">Business Sector</option>
                                {SECTORS.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                            <button 
                                onClick={() => fetchBusinessData(search, sector)}
                                className="bg-indigo-600 text-white text-xs font-bold px-6 py-2 rounded-lg shadow-lg active:scale-95 transition-transform"
                            >
                                Search
                            </button>
                        </div>
                    </div>

                    {/* 2. CATEGORY GRID (50 SECTORS) */}
                    {!search && !sector && (
                        <div className="px-4 py-6">
                            <h2 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4">Premium Sectors</h2>
                            <div className="grid grid-cols-3 gap-3">
                                {SECTORS.slice(0, 50).map((s, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => { setSector(s); fetchBusinessData("", s); }}
                                        className="bg-white p-4 rounded-2xl flex flex-col items-center justify-center text-center premium-shadow border border-slate-50 active:bg-indigo-50 transition-colors"
                                    >
                                        <div className="text-indigo-500 mb-2">
                                            <i data-lucide="layers" className="w-6 h-6"></i>
                                        </div>
                                        <span className="text-[10px] font-semibold text-slate-700 leading-tight">{s}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 3. SEARCH RESULTS */}
                    {(search || sector) && (
                        <div className="px-4 py-4">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-slate-800 tracking-tight">Top Results</h2>
                                <span className="text-xs text-slate-500">{results.length} companies found</span>
                            </div>
                            
                            {loading ? (
                                <div className="flex justify-center py-20">
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {results.map(biz => (
                                        <div key={biz.id} className="bg-white rounded-2xl p-5 premium-shadow border border-slate-100">
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <span className="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">{biz.sector}</span>
                                                    <h3 className="text-base font-bold text-slate-900">{biz.name}</h3>
                                                    <p className="text-xs text-slate-500 flex items-center mt-1">
                                                        <i data-lucide="map-pin" className="w-3 h-3 mr-1"></i> {biz.city}, {biz.country}
                                                    </p>
                                                </div>
                                                <button 
                                                    onClick={() => handleViewDetails(biz.id)}
                                                    className="bg-slate-900 text-white text-[10px] font-bold px-3 py-2 rounded-lg"
                                                >
                                                    VIEW DETAILS
                                                </button>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 pt-3 border-t border-slate-50">
                                                <div className="flex items-center gap-2 text-slate-400">
                                                    <i data-lucide="phone" className="w-3 h-3"></i>
                                                    <span className="text-[11px] font-medium italic">Available on unlock</span>
                                                </div>
                                                <div className="flex items-center gap-2 text-slate-400">
                                                    <i data-lucide="mail" className="w-3 h-3"></i>
                                                    <span className="text-[11px] font-medium italic">Available on unlock</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* 6. CORPORATE EQUITY HUB */}
                    <div className="mx-4 mt-8 mb-12 p-6 bg-slate-900 rounded-3xl text-white shadow-2xl">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="bg-indigo-500 p-2 rounded-xl">
                                <i data-lucide="calculator" className="w-5 h-5"></i>
                            </div>
                            <h2 className="text-lg font-bold">Equity Strategy Hub</h2>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="text-[10px] text-slate-400 uppercase font-bold mb-1 block">Annual Company Profit ($)</label>
                                <input 
                                    type="number"
                                    className="w-full bg-slate-800 border-none rounded-xl py-3 px-4 text-sm text-white focus:ring-1 focus:ring-indigo-500"
                                    placeholder="e.g. 1000000"
                                    value={profit}
                                    onChange={(e) => setProfit(e.target.value)}
                                />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-400 uppercase font-bold mb-1 block">Your Equity Share (%)</label>
                                <input 
                                    type="number"
                                    className="w-full bg-slate-800 border-none rounded-xl py-3 px-4 text-sm text-white focus:ring-1 focus:ring-indigo-500"
                                    placeholder="e.g. 15"
                                    value={equity}
                                    onChange={(e) => setEquity(e.target.value)}
                                />
                            </div>
                            <button 
                                onClick={calculateEquity}
                                className="w-full bg-indigo-600 py-4 rounded-xl font-bold text-sm shadow-lg shadow-indigo-900/20 active:scale-95 transition-all"
                            >
                                Calculate Personal Earnings
                            </button>
                            {earnings > 0 && (
                                <div className="mt-4 p-4 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl text-center">
                                    <span className="text-xs text-indigo-300 block mb-1 uppercase font-bold">Estimated Take-home</span>
                                    <span className="text-2xl font-black text-indigo-400">${earnings.toLocaleString()}</span>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 4. PAYWALL OVERLAY */}
                    {showPaywall && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center px-4 pb-10 paywall-blur bg-black/40">
                            <div className="bg-white w-full max-w-md rounded-[2.5rem] p-8 animate-in slide-in-from-bottom duration-500">
                                <div className="flex flex-col items-center text-center">
                                    <div className="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                                        <i data-lucide="crown" className="text-indigo-600 w-8 h-8"></i>
                                    </div>
                                    <h2 className="text-2xl font-black text-slate-900">Trial Limit Reached</h2>
                                    <p className="text-slate-500 text-sm mt-2 mb-8 px-4">Get unlimited access to phone numbers, emails, and financial data for 50M+ businesses.</p>
                                    
                                    <div className="w-full space-y-4">
                                        {/* Option 1 */}
                                        <div 
                                            onClick={() => handlePayment(100)}
                                            className="relative border-2 border-slate-100 p-5 rounded-2xl flex justify-between items-center active:border-indigo-600 transition-all cursor-pointer group"
                                        >
                                            <div className="text-left">
                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Monthly</span>
                                                <p className="text-xl font-black text-slate-800">$100<span className="text-sm font-medium text-slate-500">/mo</span></p>
                                            </div>
                                            <div className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold group-active:bg-indigo-600">
                                                SUBSCRIBE
                                            </div>
                                        </div>

                                        {/* Option 2 */}
                                        <div 
                                            onClick={() => handlePayment(1100)}
                                            className="relative border-2 border-indigo-600 p-5 rounded-2xl flex justify-between items-center bg-indigo-50/50 cursor-pointer"
                                        >
                                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-indigo-600 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter">
                                                Best Value - Save $100
                                            </div>
                                            <div className="text-left">
                                                <span className="text-xs font-bold text-indigo-600 uppercase tracking-widest">Yearly Access</span>
                                                <p className="text-xl font-black text-slate-800">$1,100<span className="text-sm font-medium text-slate-500">/yr</span></p>
                                            </div>
                                            <div className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">
                                                SUBSCRIBE
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={() => setShowPaywall(false)}
                                        className="mt-6 text-slate-400 text-xs font-bold uppercase tracking-widest"
                                    >
                                        Maybe Later
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide icons after rendering
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 500);
    </script>
</body>
</html>
