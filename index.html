<style>
  * { box-sizing: border-box; }
  body {
    background: #03060f;
    color: #e2e8f8;
    font-family: 'DM Sans', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #060d1f; }
  ::-webkit-scrollbar-thumb { background: #1e3478; border-radius: 3px; }

  /* Grid background texture */
  .grid-bg {
    background-image:
      linear-gradient(rgba(30,52,120,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,52,120,0.08) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* Noise overlay */
  .noise::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* Gold gradient text */
  .gold-text {
    background: linear-gradient(135deg, #f5d87a 0%, #d4a820 50%, #f5d87a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;

  /* Glow effects */
  .gold-glow { box-shadow: 0 0 20px rgba(212,168,32,0.25), 0 0 40px rgba(212,168,32,0.1); }

  .blur-locked { filter: blur(5px); user-select: none; pointer-events: none; }

  .sticky-bar { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(20px); }

    0%, 100% { box-shadow: 0 0 0 0 rgba(212,168,32,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(212,168,32,0); }
  }
  .badge-pulse { animation: pulse-gold 2.5s ease-in-out infinite; }

  /* Modal backdrop */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(3,6,15,0.92);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;

  .cat-energy { background: rgba(234,179,8,0.12); color: #fde047; border-color: rgba(234,179,8,0.3); }
  .cat-real-estate { background: rgba(244,63,94,0.12); color: #fda4af; border-color: rgba(244,63,94,0.3); }
  .cat-default { background: rgba(148,163,200,0.1); color: #94a3c8; border-color: rgba(148,163,200,0.25); }

  /* Scrollfade in */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-animate { animation: fadeSlideUp 0.4s ease both; }
  .card-animate:nth-child(1) { animation-delay: 0.05s; }
  .card-animate:nth-child(2) { animation-delay: 0.1s; }
  .card-animate:nth-child(3) { animation-delay: 0.15s; }
  .card-animate:nth-child(4) { animation-delay: 0.2s; }
  .card-animate:nth-child(5) { animation-delay: 0.25s; }
  .card-animate:nth-child(6) { animation-delay: 0.3s; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    width: 100%;

  input[type="range"]::-webkit-slider-thumb {

    border-radius: 6px;

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const values = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === ',' && !inQuotes) { values.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    values.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (values[i] || '').replace(/^"|"$/g, ''); });
    return obj;
  }).filter(row => row.Name && row.Name.trim() !== '');

// MAIN APP
// ─────────────────────────────────────────────
function App() {
  const [data, setData] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState('');
  const [search, setSearch] = React.useState('');
  const [filterCountry, setFilterCountry] = React.useState('');
  const [filterState, setFilterState] = React.useState('');
  const [filterCity, setFilterCity] = React.useState('');
  const [filterCat, setFilterCat] = React.useState('');
  const [revealedIds, setRevealedIds] = React.useState(() => new Set(JSON.parse(localStorage.getItem('nexus_revealed') || '[]')));
  const [trialsUsed, setTrialsUsed] = React.useState(() => parseInt(localStorage.getItem('nexus_trials') || '0', 10));
  const [showPaywall, setShowPaywall] = React.useState(false);

  const trialsLeft = Math.max(0, MAX_FREE_TRIALS - trialsUsed);

  // Load data
  React.useEffect(() => {
    const fetchData = async () => {
      setLoading(true);
      if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL === 'YOUR_GOOGLE_SHEET_CSV_LINK_HERE') {
        // Use demo data
        setTimeout(() => {
          setData(DEMO_DATA.map((d, i) => ({ ...d, _id: `demo-${i}` })));
          setLoading(false);
        }, 900);
        return;
      }
      try {
        const res = await fetch(GOOGLE_SHEET_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const parsed = parseCSV(text).map((d, i) => ({ ...d, _id: `row-${i}` }));
        setData(parsed);
      } catch (err) {
        setError('Could not load sheet data. Showing demo records.');
        setData(DEMO_DATA.map((d, i) => ({ ...d, _id: `demo-${i}` })));
      } finally {
        setLoading(false);
      }
    };
    fetchData();
  }, []);

  // Persist trials
  React.useEffect(() => { localStorage.setItem('nexus_trials', trialsUsed); }, [trialsUsed]);
  React.useEffect(() => { localStorage.setItem('nexus_revealed', JSON.stringify([...revealedIds])); }, [revealedIds]);

  // Filter option lists
  const countries = React.useMemo(() => [...new Set(data.map(d => d.Country).filter(Boolean))].sort(), [data]);
  const states = React.useMemo(() => [...new Set(data.filter(d => !filterCountry || d.Country === filterCountry).map(d => d.State).filter(Boolean))].sort(), [data, filterCountry]);
  const cities = React.useMemo(() => [...new Set(data.filter(d => (!filterCountry || d.Country === filterCountry) && (!filterState || d.State === filterState)).map(d => d.City).filter(Boolean))].sort(), [data, filterCountry, filterState]);
  const categories = React.useMemo(() => [...new Set(data.map(d => d.Category).filter(Boolean))].sort(), [data]);

  // Filtered results
  const filtered = React.useMemo(() => {
    const q = search.toLowerCase().trim();
    return data.filter(d =>
      (!q || [d.Name, d.Category, d.Country, d.State, d.City].some(f => f && f.toLowerCase().includes(q))) &&
      (!filterCountry || d.Country === filterCountry) &&
      (!filterState || d.State === filterState) &&
      (!filterCity || d.City === filterCity) &&
      (!filterCat || d.Category === filterCat)
    );
  }, [data, search, filterCountry, filterState, filterCity, filterCat]);

  // Cascade reset
  const handleCountryChange = v => { setFilterCountry(v); setFilterState(''); setFilterCity(''); };
  const handleStateChange = v => { setFilterState(v); setFilterCity(''); };

  // Reveal handler
  const handleReveal = (id) => {
    if (revealedIds.has(id)) return;
    if (trialsUsed >= MAX_FREE_TRIALS) { setShowPaywall(true); return; }
    const next = new Set(revealedIds);
    next.add(id);
    setRevealedIds(next);
    setTrialsUsed(prev => prev + 1);
  };
